# Orbit CI component: release
# Creates a Forge release when its job succeeds. See README.md in this folder.
spec:
  inputs:
    tag_name:
      type: string
      description: Tag of the release. In a tag pipeline, use $CI_COMMIT_TAG.
    name:
      type: string
      default: ""
      description: Title of the release. Forge uses the tag name when this is empty.
    description:
      type: string
      default: ""
      description: Release notes.
    ref:
      type: string
      default: ""
      description: Branch, tag or commit that Forge creates the tag from when the tag does not exist.
    links:
      type: array
      default: []
      description: Release links, each with name, url and optionally link_type.
    stage:
      type: string
      default: deploy
      description: Stage of the release job. The stage must be listed under stages.
    image:
      type: string
      default: alpine:3.23
      description: Image of the release job. It needs /bin/sh.
    tags:
      type: array
      default: []
      description: Runner tags. An empty list matches any runner of the project.
    rules:
      type: array
      default:
        - if: $CI_COMMIT_TAG
      description: Rules of the release job. By default it runs in tag pipelines only.
---
release:
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image ]]
  tags: $[[ inputs.tags ]]
  rules: $[[ inputs.rules ]]
  script:
    - echo "Forge creates the release when this job succeeds"
  release:
    tag_name: $[[ inputs.tag_name ]]
    name: $[[ inputs.name ]]
    description: $[[ inputs.description ]]
    ref: $[[ inputs.ref ]]
    assets:
      links: $[[ inputs.links ]]
